
name: CI - Pet Shop Eriwa

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verificacao:
    name: Verificações automáticas
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Verificar arquivos do projeto
        run: |
          test -s index.html
          test -s style.css
          test -s script.js

      - name: Verificar sintaxe JavaScript
        run: node --check script.js

      - name: Executar teste automatizado básico
        run: |
          node -e "const fs = require('fs'); const assert = require('assert'); assert(fs.readFileSync('index.html', 'utf8').length > 0); assert(fs.readFileSync('script.js', 'utf8').length > 0); console.log('Teste aprovado: arquivos principais encontrados e não vazios.');"
